name: Deploy real estate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: real-estate-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s %s\n' \
            "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

      - name: Pull main on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          cd /var/www/public/real-estate

          if [ "$(git branch --show-current)" != "main" ]; then
            echo "Deployment stopped: checkout is not on main."
            exit 1
          fi

          git pull --ff-only origin main
          git log -1 --format='%h %s'
          REMOTE
